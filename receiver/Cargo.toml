[package]
name = "receiver"
version = "0.1.0"
description = "Raspberry Pi bridge: nRF24L01+ packets to MQTT and Home Assistant."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
protocol = { path = "../protocol" }
rumqttc = "0.25.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["formatting"] }
toml = "1.2.2"

[lints]
workspace = true

[dev-dependencies]
time = { version = "0.3.55", features = ["macros"] }
